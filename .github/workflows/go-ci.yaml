name: product-catalog-ci

on:
    workflow_dispatch:

jobs:
    
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Setup Go 1.22
              uses: actions/setup-go@v2
              with:
                go-version: 1.22

            - name: Build
              run: go build -o product-catalog-service src/product-catalog/main.go

            - name: unit tests
              run: go test src/product-catalog/...

    code-quality:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4


            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v6
              with:
                version: v1.55.2
                run: golangci-lint run
                working-directory: src/product-catalog

    docker-trivy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: install Docker
              uses: docker/setup-buildx-action@v2

            - name: login to docker
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: docker build 
              uses: docker/build-push-action@v6
              with:
                context: src/product-catalog
                file: Dockerfile
                push: false
                tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:latest

            - name: trivy scan
              uses: aquasecurity/trivy-action@v0.6.0
              with:
                image-ref: ${{ secrets.DOCKER_USERNAME }}/product-catalog:latest
                format: sarif
                output: trivy-report.sarif
                exit-code: '0'
                severity: 'CRITICAL,HIGH'
                ignore-unfixed: true

            - name: Upload Trivy SARIF report
              uses: github/codeql-action/upload-sarif@v2
              with:
                sarif_file: trivy-report.sarif

            - name: Docker push
              uses: docker/build-push-action@v6
              with:
                context: src/product-catalog
                file: Dockerfile
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id}}

    
    update-k8s:
        runs-on: ubuntu-latest

        needs: docker-trivy

        steps:
        - name: checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN}}

        - name: update tag in k8s deployment manifest
          run: |
               sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml

        - name: commit and psuh changes
          run: |
                git config --global user.email "reonbritto@gmail.com"
                git config --global user.name "reonbritto"
                git add kubernetes/productcatalog/deploy.yaml
                git commit -m "[CI]: Update product-catalog image tag to ${{github.run_id}}"
                git push
