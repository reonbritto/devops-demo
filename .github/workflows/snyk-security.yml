name: Snyk Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for uploading SARIF results
      actions: read # for private repos (required by upload-sarif)
    runs-on: ubuntu-latest

    steps:
      # 🧩 Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 🛠️ Set up Snyk CLI
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@v4
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 🧠 (Optional) Set up Node, Python, etc. if your project needs dependencies installed before scanning
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 20

      # 🔍 Run Snyk Code (SAST) analysis
      - name: Snyk Code Test
        run: snyk code test --sarif > snyk-code.sarif || true

      # 📦 Scan Open Source dependencies (SCA)
      - name: Snyk Open Source Monitor
        run: snyk monitor --all-projects || true

      # ☁️ Scan Infrastructure as Code (Terraform, K8s, etc.)
      - name: Snyk IaC Test and Report
        run: snyk iac test --report || true

      # 🐳 Build Docker image for container scanning
      - name: Build Docker Image
        run: docker build -t myapp:latest . || true

      # 🔐 Scan Container for vulnerabilities
      - name: Snyk Container Monitor
        run: snyk container monitor myapp:latest --file=Dockerfile || true

      # ⬆️ Upload Snyk Code (SAST) results to GitHub Security tab
      - name: Upload Results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
